<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aesthetic Calculator</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #fdf6f0, #f8ede3, #f5e6da);
      padding: 20px;
      transition: background 0.3s ease;
    }

    body.dark {
      background: linear-gradient(135deg, #2f2723, #3c312c, #4a3d36);
    }

    .calculator {
      width: 380px;
      background: rgba(255, 250, 245, 0.92);
      backdrop-filter: blur(10px);
      border-radius: 28px;
      padding: 22px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.7);
      transition: background 0.3s ease, color 0.3s ease;
    }

    body.dark .calculator {
      background: rgba(55, 44, 39, 0.95);
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      gap: 10px;
    }

    .title {
      font-size: 1.05rem;
      font-weight: bold;
      color: #7c5e4a;
      letter-spacing: 0.5px;
    }

    body.dark .title {
      color: #f3dfcf;
    }

    .toggle {
      border: none;
      background: #e8d5c4;
      color: #5a4636;
      border-radius: 14px;
      padding: 10px 14px;
      cursor: pointer;
      font-size: 0.9rem;
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.06);
    }

    body.dark .toggle {
      background: #6f5b50;
      color: #fff6ef;
    }

    .display {
      width: 100%;
      height: 75px;
      border: none;
      outline: none;
      border-radius: 20px;
      background: #fffaf5;
      box-shadow: inset 0 4px 14px rgba(0, 0, 0, 0.05);
      text-align: right;
      font-size: 2rem;
      padding: 15px;
      color: #5a4636;
      margin-bottom: 14px;
    }

    body.dark .display {
      background: #2b221e;
      color: #fff3ea;
    }

    .memory-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 12px;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    button {
      height: 58px;
      border: none;
      border-radius: 18px;
      font-size: 1.05rem;
      cursor: pointer;
      background: #fffaf5;
      color: #6b4f3b;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.06);
      transition: all 0.2s ease;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 22px rgba(0, 0, 0, 0.08);
    }

    body.dark button {
      background: #3b2f29;
      color: #f8e9dd;
    }

    .operator {
      background: #e8d5c4;
      color: #5a4636;
      font-weight: bold;
    }

    body.dark .operator {
      background: #7c6457;
      color: #fff7f1;
    }

    .equal {
      background: #c8a98b;
      color: white;
      grid-column: span 2;
    }

    .clear {
      background: #f3e4d7;
      color: #7c5e4a;
      font-weight: bold;
    }

    body.dark .clear {
      background: #8d7364;
      color: white;
    }

    .zero {
      grid-column: span 2;
    }

    .scientific-section {
      margin-top: 14px;
      display: none;
    }

    .scientific-section.show {
      display: block;
    }

    .mode-button {
      width: 100%;
      margin-top: 12px;
      background: #dbc1ae;
      color: #5a4636;
      font-weight: bold;
    }

    body.dark .mode-button {
      background: #8a6f61;
      color: #fff7f1;
    }

    .scientific-buttons {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 12px;
    }

    .memory-note {
      margin-top: 12px;
      text-align: center;
      font-size: 0.88rem;
      color: #7b6657;
    }

    body.dark .memory-note {
      color: #e7d5c9;
    }
  </style>
</head>
<body>
  <div class="calculator">
    <div class="top-bar">
      <div class="title">Calculator ✿</div>
      <button class="toggle" onclick="toggleTheme()">☾ Theme</button>
    </div>

    <input type="text" class="display" id="display" />

    <div class="memory-row">
      <button onclick="memoryAdd()">M+</button>
      <button onclick="memorySubtract()">M-</button>
      <button onclick="memoryRecall()">MR</button>
    </div>

    <div class="buttons">
      <button class="clear" onclick="clearDisplay()">C</button>
      <button onclick="appendValue('/')" class="operator">÷</button>
      <button onclick="appendValue('*')" class="operator">×</button>
      <button onclick="deleteLast()">⌫</button>

      <button onclick="appendValue('7')">7</button>
      <button onclick="appendValue('8')">8</button>
      <button onclick="appendValue('9')">9</button>
      <button onclick="appendValue('-')" class="operator">−</button>

      <button onclick="appendValue('4')">4</button>
      <button onclick="appendValue('5')">5</button>
      <button onclick="appendValue('6')">6</button>
      <button onclick="appendValue('+')" class="operator">+</button>

      <button onclick="appendValue('1')">1</button>
      <button onclick="appendValue('2')">2</button>
      <button onclick="appendValue('3')">3</button>
      <button onclick="appendValue('.')">.</button>

      <button onclick="appendValue('0')" class="zero">0</button>
      <button onclick="calculate()" class="equal">=</button>
    </div>

    <button class="mode-button" onclick="toggleScientificMode()">Scientific Mode</button>

    <div class="scientific-section" id="scientificSection">
      <div class="scientific-buttons">
        <button onclick="applyScientific('sin')">sin</button>
        <button onclick="applyScientific('cos')">cos</button>
        <button onclick="applyScientific('log')">log</button>
      </div>
    </div>

    <div class="memory-note" id="memoryNote">Memory: 0</div>
  </div>

  <script>
    const display = document.getElementById('display');
    const scientificSection = document.getElementById('scientificSection');
    const memoryNote = document.getElementById('memoryNote');
    let memory = 0;

    function appendValue(value) {
      display.value += value;
    }

    function clearDisplay() {
      display.value = '';
    }

    function deleteLast() {
      display.value = display.value.slice(0, -1);
    }

    function calculate() {
      try {
        display.value = eval(display.value);
      } catch (error) {
        display.value = 'Error';
      }
    }

    function memoryAdd() {
      const value = parseFloat(display.value) || 0;
      memory += value;
      updateMemoryNote();
    }

    function memorySubtract() {
      const value = parseFloat(display.value) || 0;
      memory -= value;
      updateMemoryNote();
    }

    function memoryRecall() {
      display.value = memory;
    }

    function updateMemoryNote() {
      memoryNote.textContent = 'Memory: ' + memory;
    }

    function applyScientific(type) {
      const value = parseFloat(display.value);

      if (isNaN(value)) {
        display.value = 'Error';
        return;
      }

      if (type === 'sin') {
        display.value = Math.sin(value);
      } else if (type === 'cos') {
        display.value = Math.cos(value);
      } else if (type === 'log') {
        if (value <= 0) {
          display.value = 'Error';
        } else {
          display.value = Math.log10(value);
        }
      }
    }

    function toggleScientificMode() {
      scientificSection.classList.toggle('show');
    }

    function toggleTheme() {
      document.body.classList.toggle('dark');
    }

    document.addEventListener('keydown', function(event) {
      const key = event.key;

      if ((key >= '0' && key <= '9') || ['+', '-', '*', '/', '.'].includes(key)) {
        appendValue(key);
      } else if (key === 'Enter') {
        event.preventDefault();
        calculate();
      } else if (key === 'Backspace') {
        deleteLast();
      } else if (key === 'Escape') {
        clearDisplay();
      }
    });
  </script>
</body>
</html>
